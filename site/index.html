<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fish Cam – Gateway</title>
  <link rel="stylesheet" href="CSS/style.css">
</head>
<body>
  <main class="gate" aria-label="gateway">
    <div>
      <h1>Fish Cam – Login</h1>
      <div class="muted">Enter your username and password to continue</div>
        </div>
      <div>
        <input id="un" type="username" autofocus />
      </div>
      <div>
        <input id="pw" type="password" autocomplete="current-password" autofocus />
      </div>

    <button id="enter" class="primary">Enter</button>
    <div id="msg" class="err"></div>
  </main>
  <script src="js/gate.logic.js"></script>
</body>
</html>
