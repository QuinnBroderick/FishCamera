##
## FishCam NGINX Configuration
## HTTP → HTTPS redirect + HTTPS site
##

########################################
# HTTP ENTRYPOINT (PORT 80)
# Redirects all traffic to HTTPS
########################################

server {
    listen 80;
    server_name fishcam.quinnsfishcam.com;

    # Permanent redirect to HTTPS
    return 301 https://$host$request_uri;
}

########################################
# HTTPS SERVER (PORT 443)
# Real FishCam site lives here
########################################

server {
    listen 443 ssl;
    server_name fishcam.quinnsfishcam.com;

    # Let's Encrypt TLS certificate
    ssl_certificate     /etc/letsencrypt/live/quinnsfishcam.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quinnsfishcam.com/privkey.pem;

    # Static site files
    root /var/www/FishCam;
    index index.html fishcam.html gateway.html;

    ####################################
    # Serve static site files
    ####################################
    location / {
        try_files $uri $uri/ =404;
    }

    ####################################
    # ESP32-CAM control endpoints
    # (internal HTTP on LAN)
    ####################################
    location /status {
        proxy_pass http://xxx.xxx.xxx.xxx;
    }

    location /capture {
        proxy_pass http://xxx.xxx.xxx.xxx;
    }

    location /control {
        proxy_pass http://xxx.xxx.xxx.xxx;
    }

    ####################################
    # MJPEG video stream
    # Buffering disabled for live video
    ####################################
    location /stream {
        proxy_pass http://xxx.xxx.xxx.xxx:81/stream?;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }
}
